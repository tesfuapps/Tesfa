<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesfaye Tilahun — Graphic Designer &amp; Art Director</title>
    <meta name="description" content="Portfolio of Tesfaye Tilahun, a graphic designer and art director crafting visual identities, brand systems, and marketing materials for founders and businesses worldwide." />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: Archivo (display) + Space Grotesk (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tesfaye Tilahun — Graphic Designer &amp; Art Director" />
    <meta property="og:description" content="Visual identities with clarity, character &amp; craft. Based in Addis Ababa, Ethiopia — working worldwide." />
    <meta property="og:image" content="/images/projects/Tesfu Tilahun. (2).jpg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tesfaye Tilahun — Graphic Designer &amp; Art Director" />
    <meta name="twitter:description" content="Visual identities with clarity, character &amp; craft. Based in Addis Ababa, Ethiopia — working worldwide." />
    <meta name="twitter:image" content="/images/projects/Tesfu Tilahun. (2).jpg" />

    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
